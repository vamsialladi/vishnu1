services:
  postgres:
    image: postgres:16-alpine
    container_name: plantcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plantcare_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plantcare_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: plantcare-backend:latest
    container_name: plantcare-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/plantcare_prod
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
